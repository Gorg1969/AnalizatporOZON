<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разовый анализ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 560px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
        .back { 
            color: #6b7280; 
            text-decoration: none; 
            display: inline-block; 
            margin-bottom: 20px;
            font-size: 14px;
        }
        .back:hover { color: #6366f1; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #1a1a2e; }
        input[type="url"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            transition: border 0.3s;
            outline: none;
        }
        input[type="url"]:focus { border-color: #6366f1; }
        .hint { font-size: 13px; color: #6b7280; margin-top: 6px; }
        button {
            width: 100%;
            padding: 16px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }
        button:hover { background: #4f46e5; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { 
            color: #ef4444; 
            font-size: 14px; 
            margin-top: 12px; 
            display: none;
            background: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }
        .loading { display: none; text-align: center; margin-top: 20px; }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .ad-container { 
            display: none; 
            margin-top: 24px; 
            padding: 20px; 
            border: 2px dashed #e5e7eb; 
            border-radius: 12px; 
            text-align: center; 
        }
        .ad-container h3 { margin-bottom: 12px; color: #6b7280; }
        .ad-placeholder { 
            background: #f8fafc; 
            padding: 30px; 
            border-radius: 8px; 
            font-size: 14px; 
            color: #6b7280; 
        }
        .watch-ad-btn {
            width: auto !important;
            padding: 12px 32px !important;
            background: #f59e0b !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            margin-top: 10px !important;
            display: inline-block !important;
        }
        .watch-ad-btn:hover { background: #d97706 !important; }
        .watch-ad-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #adStatus { margin-top: 12px; font-size: 14px; color: #6b7280; }
        
        .download-btn {
            display: none;
            width: 100%;
            padding: 16px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        .download-btn:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Назад к меню</a>
        <h1>📄 Разовый анализ</h1>
        <p style="color:#6b7280;margin-bottom:20px;">Вставьте ссылку на карточку товара</p>
        
        <form id="analyzeForm">
            <label for="url">Ссылка на карточку</label>
            <input type="url" id="url" placeholder="https://www.wildberries.ru/catalog/..." required>
            <div class="hint">Поддерживаются: Wildberries, Ozon, Яндекс.Маркет</div>
            <div id="error" class="error"></div>
            <button type="submit" id="analyzeBtn">🔍 Анализировать</button>
        </form>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top:12px;color:#6b7280;">Анализируем карточку...</p>
        </div>
        
        <div id="adContainer" class="ad-container">
            <h3>📺 Просмотрите рекламу для доступа к отчёту</h3>
            <div class="ad-placeholder">
                [Здесь будет рекламный блок]
                <br><br>
                <button id="watchAdBtn" class="watch-ad-btn">
                    📺 Смотреть рекламу (30 сек)
                </button>
            </div>
            <div id="adStatus"></div>
        </div>
        
        <button id="downloadBtn" class="download-btn">⬇️ Скачать отчёт</button>
    </div>
    
    <script>
        let sessionId = null;
        let adWatched = false;
        
        document.getElementById('analyzeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const url = document.getElementById('url').value.trim();
            const errorEl = document.getElementById('error');
            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            
            // Сброс
            errorEl.style.display = 'none';
            errorEl.textContent = '';
            document.getElementById('adContainer').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
            adWatched = false;
            document.getElementById('adStatus').textContent = '';
            
            // Валидация
            if (!url) {
                errorEl.textContent = '⚠️ Введите ссылку';
                errorEl.style.display = 'block';
                return;
            }
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                errorEl.textContent = '⚠️ Ссылка должна начинаться с http:// или https://';
                errorEl.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '⏳ Обработка...';
            loading.style.display = 'block';
            
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    errorEl.textContent = '⚠️ ' + data.error;
                    errorEl.style.display = 'block';
                    return;
                }
                
                if (data.success) {
                    sessionId = data.session_id;
                    document.getElementById('adContainer').style.display = 'block';
                }
                
            } catch (err) {
                errorEl.textContent = '⚠️ Ошибка сервера. Попробуйте позже.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Анализировать';
                loading.style.display = 'none';
            }
        });
        
        // Просмотр рекламы
        document.getElementById('watchAdBtn').addEventListener('click', function() {
            if (adWatched) return;
            
            const btn = this;
            btn.disabled = true;
            btn.textContent = '⏳ Идёт просмотр...';
            document.getElementById('adStatus').textContent = '⏳ Пожалуйста, подождите 30 секунд...';
            
            let seconds = 30;
            const interval = setInterval(() => {
                seconds--;
                document.getElementById('adStatus').textContent = `⏳ Осталось ${seconds} секунд...`;
                if (seconds <= 0) {
                    clearInterval(interval);
                    adWatched = true;
                    document.getElementById('adStatus').innerHTML = '✅ Реклама просмотрена! Отчёт готов к скачиванию.';
                    document.getElementById('downloadBtn').style.display = 'block';
                    btn.textContent = '✅ Просмотрено';
                    btn.disabled = true;
                }
            }, 1000);
        });
        
        // Скачивание отчёта
        document.getElementById('downloadBtn').addEventListener('click', function() {
            if (!sessionId) {
                alert('Ошибка: сессия не найдена');
                return;
            }
            if (!adWatched) {
                alert('Пожалуйста, сначала просмотрите рекламу');
                return;
            }
            window.location.href = `/api/download/${sessionId}`;
        });
    </script>
</body>
</html>
